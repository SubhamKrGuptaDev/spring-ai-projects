spring.application.name=github_copilot_spring_ai

# Tell Spring AI to talk to GitHub's API gateway instead of OpenAI
spring.ai.openai.base-url=https://api.githubcopilot.com

# Provide your GitHub Personal Access Token here
spring.ai.openai.api-key=${GITHUB_COPILOT_API_KEY}

# Specify the model you want to target (e.g., gpt-4o or claude-3.5-sonnet)
spring.ai.openai.chat.options.model=gpt-4o


